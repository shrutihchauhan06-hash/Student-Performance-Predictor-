<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Performance Predictor</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
        }

        .container {
            width: 850px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #ff7b00, #ff9f43);
            color: white;
        }

        .header h1 {
            font-size: 32px;
        }

        .header p {
            margin-top: 8px;
            opacity: 0.9;
        }

        .content {
            display: flex;
        }

        .left {
            width: 55%;
            padding: 30px;
        }

        .right {
            width: 45%;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            color: white;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            margin-top: 10px;
            background: linear-gradient(135deg, #ff7b00, #ff9f43);
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .result-card {
            width: 100%;
            text-align: center;
            color: white;
        }

        .score {
            font-size: 70px;
            font-weight: 700;
            color: #4ade80;
        }

        .level {
            font-size: 24px;
            margin-top: 10px;
        }

        .desc {
            margin-top: 15px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🎓 AI Student Performance Predictor</h1>
            <p>Machine Learning Based Academic Performance Analysis</p>
        </div>

        <div class="content">

            <div class="left">

                <div class="input-group">
                    <label>Attendance (%)</label>
                    <input type="number" id="attendance">
                </div>

                <div class="input-group">
                    <label>Study Hours / Day</label>
                    <input type="number" id="study_hours">
                </div>

                <div class="input-group">
                    <label>Internal Marks</label>
                    <input type="number" id="internal_marks">
                </div>

                <div class="input-group">
                    <label>Assignment Score</label>
                    <input type="number" id="assignment_score">
                </div>

                <div class="input-group">
                    <label>CGPA</label>
                    <input type="number" step="0.01" id="cgpa">
                </div>

                <button onclick="predictPerformance()">
                    Predict Performance
                </button>

            </div>

            <div class="right">

                <div class="result-card">

                    <div class="score" id="marks">
                        --
                    </div>

                    <div class="level" id="level">
                        Waiting for Prediction
                    </div>

                    <div class="desc">
                        AI model will estimate final academic performance.
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        async function predictPerformance() {

            let attendance =
                parseFloat(document.getElementById("attendance").value);

            let study_hours =
                parseFloat(document.getElementById("study_hours").value);

            let internal_marks =
                parseFloat(document.getElementById("internal_marks").value);

            let assignment_score =
                parseFloat(document.getElementById("assignment_score").value);

            let cgpa =
                parseFloat(document.getElementById("cgpa").value);

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            attendance,
                            study_hours,
                            internal_marks,
                            assignment_score,
                            cgpa
                        })
                    }
                );

                const data = await response.json();

                document.getElementById("marks").innerHTML =
                    data.predicted_marks;

                document.getElementById("level").innerHTML =
                    data.performance_level;

            }
            catch (error) {

                document.getElementById("level").innerHTML =
                    "Backend Not Running";

                console.log(error);
            }

        }

    </script>

</body>

</html>
